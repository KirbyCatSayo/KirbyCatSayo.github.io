	<link rel="stylesheet" href="/404p.css">
	<style>
    	body {
    		background-color: black;
			margin: 0;
            display: flex;
            min-height: 100vh;       /* Takes 100% of viewport height */
			justify-content: center; /* Centers horizontally */
            align-items: center;     /* Centers vertically */
    	}

<body>
	<script crossorigin="anonymous" integrity="sha512-yBpuflZmP5lwMzZ03hiCLzA94N0K2vgBtJgqQ2E1meJzmIBfjbb7k4Y23k2i2c/rIeSUGc7jojyIY5waK3ZxCQ==" referrerpolicy="no-referrer" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.slim.min.js"></script>
	<script crossorigin="anonymous" integrity="sha512-6+YN/9o9BWrk6wSfGxQGpt3EUK6XeHi6yeHV+TYD2GR0Sj/cggRpXr1BrAQf0as6XslxomMUxXp2vIl+fv0QRA==" referrerpolicy="no-referrer" src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>

	<audio loop id="SpamWebSong" src="/snd/midi-spamton.mp3"></audio>
	
	<div id="center">
		<div class="Spamton" id="SpamtonCenter">
			<img alt="Spamton" class="Spamtonstatic" src="/img/Spamton_G._Spamton.webp" style="opacity: 1;">
			<img alt="Spamton" class="Spamtongif" src="/img/Spamton_overworld_dance.webp" style="opacity: 0;">
		</div>
	</div>
	<style>
  		.Spamton {
   			min-width: 320px;
    		max-width: 100%;
    		min-height: 320px;
    		max-height: 100%;
    		position: absolute;
    		color: black;
    		cursor: pointer;
  		}
		.Spamton img {
    		position: absolute;
    		height: 100%;
    		width: 100%;
    		object-fit: contain;
    		image-rendering: pixelated;
			left: 0%;
			right: 0%;
  		}
	</style>
	<script>
		//var noellewebsong = new Howl({
    	//	src: ['/snd/midi-holiday-country.mp3'],
    	//	volume: 0.5,
    	//	loop: true
  		//});

		var noellewebsong = document.getElementById('SpamWebSong');
		
		$(document).on('click', '.Spamton:not(.playing)', function() {
    		noellewebsong.play();
			
    		$('.Spamton').addClass('playing');
    		$('.Spamtonstatic').css('opacity', 0);
    		$('.Spamtongif').css('opacity', 1);
  		});
  	
  		$(document).on('click', '.Spamton.playing', function() {
    		noellewebsong.pause();
			
    		$('.Spamton').removeClass('playing');
    		$('.Spamtonstatic').css('opacity', 1);
    		$('.Spamtongif').css('opacity', 0);
  		});
	</script>
</body>
