<!DOCTYPE HTML>

<head>
  	<title>deercheck</title>
    <link rel="icon" type="image/x-icon" href="/syrthrow.ico">
    <meta name="description" content="Navori website 404 page">
	<link rel="stylesheet" href="/404p.css">
	<style>
    	body {
    		background-color: black;
			margin: 0;
            display: flex;
            min-height: 100vh;       /* Takes 100% of viewport height */
			justify-content: center; /* Centers horizontally */
            align-items: center;     /* Centers vertically */
    	}
        /* Responsive image constraints */
        /*img {*/
            /*max-width: 100%;*/
            /*height: auto;*/
        /*}*/
  	</style>
</head>
<body>
	<div id="center">
		<div class="Noelle" id="NoelleCenter">
			<img alt="Noelle Holiday" class="noellegif" src="/img/noelle-holiday.gif" style="opacity: 0;">
			<img alt="Noelle Holiday" class="noellestatic" src="/img/Noelle_Holiday_overworld.webp" style="opacity: 1;>
		</div>
	</div>
	<style>
  		.Noelle {
   			min-width: 320px;
    		max-width: 100%;
    		min-height: 320px;
    		max-height: 100%;
    		position: relative;
    		color: black;
    		cursor: pointer;
  	}
	</style>
	<script>
		var noellewebsong = new Howl({
    		src: ['/snd/midi-holiday-country.mp3'],
    		volume: 0.5,
    		loop: true
  		});
		
		$(document).on('click', '.Noelle:not(.playing)', function() {
    		noellewebsong.play();
			
    		$('.Noelle').addClass('playing');
    		$('.noellestatic').css('opacity', 0);
    		$('.noellegif').css('opacity', 1);
  		});
  	
  		$(document).on('click', '.Noelle.playing', function() {
    		noellewebsong.pause();
			
    		$('.Noelle').removeClass('playing');
    		$('.noellestatic').css('opacity', 1);
    		$('.noellegif').css('opacity', 0);
  		});
	</script>
</body>
